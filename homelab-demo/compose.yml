## ============================================================
##  Your First Homelab – live demo (one file, five steps)
##  AWS Student Community Day Kampala · Jacob Kipsang
##
##  How to use:
##    1. Uncomment the next step: delete the "# " at the start
##       of its lines. Lines starting with "##" are notes.
##    2. Run:   docker compose up -d
##    3. Check: docker compose ps
##  Stop everything at the end:  docker compose down
##  (Add -v to also delete the database data.)
## ============================================================

services:

  ## ---------- STEP 1 · DEVOPS: run your first containers ----------
  ## Run:  docker compose up -d
  ## Then: docker compose logs hello    -> "Hello from Docker!"
  ##       open http://localhost:8080   -> nginx welcome page
  # hello:
  #   image: hello-world

  # web:
  #   image: nginx
  #   ports:
  #     - "8080:80"

  ## ---------- STEP 2 · DEVOPS: put your own web page online ----------
  ## Edit site/index.html, uncomment below, run: docker compose up -d
  ## Open http://localhost:8081 -> your own page.
  ## Change the file and refresh: the page updates instantly.
  # mysite:
  #   image: nginx
  #   ports:
  #     - "8080:80"
  #   volumes:
  #     - ./site:/usr/share/nginx/html

  ## ---------- STEP 3 · DATA: start a database ----------
  ## Uncomment below AND the "volumes" block at the bottom,
  ## run: docker compose up -d, then open the database prompt:
  ##   docker compose exec db psql -U postgres
  db:
    image: postgres:16
    environment:
      POSTGRES_PASSWORD: pass
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  ## ---------- STEP 4 · DATA: store data and ask it questions ----------
  ## No new container. Inside psql (from step 3), type:
  ##
    # CREATE TABLE marks (name TEXT, course TEXT, score INT);
    # INSERT INTO marks VALUES
    #   ('Amina','Cloud',78), ('Brian','Cloud',65),
    #   ('Grace','Data',88), ('Peter','Data',72);
    # SELECT course, ROUND(AVG(score), 1) AS avg
    # FROM marks GROUP BY course;
  
  ## Leave psql with:  \q

  ## ---------- STEP 5 · DATA: chart it with Metabase ----------
  ## Uncomment below, run: docker compose up -d
  ## Wait about a minute, then open http://localhost:3000
  ## Add a database: PostgreSQL, host "db", port 5432,
  ##   database "postgres", user "postgres", password "pass"
  ## New -> Question -> marks -> Average of score by course -> Bar
  ## No network commands needed: Compose puts every service on
  ## one network, so Metabase finds the database by the name "db".
  metabase:
    image: metabase/metabase
    ports:
      - "3000:3000"
    depends_on:
      - db

## ---------- uncomment together with STEP 3 ----------
volumes:
  pgdata:
